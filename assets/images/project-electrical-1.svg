<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A2B"/>
      <stop offset="60%" stop-color="#0D2D4D"/>
      <stop offset="100%" stop-color="#040F1A"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#panelBg)"/>
  <!-- Distribution Board Enclosure -->
  <rect x="220" y="60" width="360" height="340" rx="12" fill="#0C1D30" stroke="#168BCE" stroke-width="3"/>
  <rect x="240" y="80" width="320" height="300" rx="6" fill="#06121E" stroke="#1E3A5F" stroke-width="1.5"/>
  <!-- DIN Rails -->
  <rect x="255" y="130" width="290" height="12" fill="#334155" rx="2"/>
  <rect x="255" y="230" width="290" height="12" fill="#334155" rx="2"/>
  <!-- MCB Breakers Row 1 -->
  <g transform="translate(265, 110)">
    <rect x="0" y="0" width="40" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="12" y="10" width="16" height="22" rx="2" fill="#DC2626"/>
    <rect x="50" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="58" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="90" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="98" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="130" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="138" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="170" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="178" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="210" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="218" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
  </g>
  <!-- MCB Breakers Row 2 -->
  <g transform="translate(265, 210)">
    <rect x="0" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="8" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="40" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="48" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="80" y="0" width="30" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="88" y="10" width="14" height="22" rx="2" fill="#22C55E"/>
    <rect x="120" y="0" width="40" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <rect x="132" y="10" width="16" height="22" rx="2" fill="#3B82F6"/>
    <rect x="170" y="0" width="70" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="205" y="40" text-anchor="middle" fill="#FDE047" font-size="10" font-weight="700">RCCB</text>
  </g>
  <!-- Conduit Wires -->
  <path d="M400,20 L400,60" stroke="#F59E0B" stroke-width="6" fill="none"/>
  <path d="M380,20 L380,60" stroke="#DC2626" stroke-width="5" fill="none"/>
  <path d="M420,20 L420,60" stroke="#2563EB" stroke-width="5" fill="none"/>
