  <rect x="40" y="35" width="150" height="32" rx="4" fill="#F5A623" fill-opacity="0.15" stroke="#F5A623" stroke-width="1"/>
  <circle cx="58" cy="51" r="5" fill="#F5A623"/>
  <text x="75" y="56" fill="#FBBF24" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">PHASE 3 // ACTIVE</text>
  <!-- Footer Banner -->
  <rect x="40" y="420" width="720" height="48" rx="6" fill="#071A2B" fill-opacity="0.85" stroke="#168BCE" stroke-width="1.5"/>
  <text x="60" y="450" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16">MAIN DISTRIBUTION BOARD &amp; MCB UPGRADE</text>
  <text x="740" y="450" text-anchor="end" fill="#F5A623" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MALVANI RESIDENTIAL COMPLEX</text>
</svg>