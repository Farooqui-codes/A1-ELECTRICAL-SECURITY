<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051525"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#officeBg)"/>
  <!-- Room Perspective Lines -->
  <line x1="0" y1="0" x2="250" y2="160" stroke="#1E3A5F" stroke-width="1.5"/>
  <line x1="800" y1="0" x2="550" y2="160" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="250" y="160" width="300" height="200" fill="#091E33" stroke="#168BCE" stroke-width="2"/>
  <!-- Suspended Modern Architectural LED Panel -->
  <g transform="translate(400, 100)">
    <polygon points="-240,-20 240,-20 180,20 -180,20" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="-230,-15 230,-15 175,15 -175,15" fill="#FFFFFF" opacity="0.95"/>
    <!-- Light Glow -->
    <polygon points="-200,20 200,20 320,320 -320,320" fill="#38BDF8" fill-opacity="0.12"/>
  </g>
  <!-- Modern Wall Switches & Sockets -->
  <g transform="translate(360, 240)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="15" y="15" width="22" height="30" rx="4" fill="#0F172A"/>
    <rect x="45" y="15" width="22" height="30" rx="4" fill="#0F172A"/>
    <circle cx="26" cy="22" r="3" fill="#38BDF8"/>
  </g>
  <!-- Status Badge -->
  <rect x="40" y="35" width="160" height="32" rx="4" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
  <circle cx="58" cy="51" r="5" fill="#3B82F6"/>
  <text x="75" y="56" fill="#60A5FA" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MODULAR // COMPLETE</text>
  <!-- Footer Banner -->
  <rect x="40" y="420" width="720" height="48" rx="6" fill="#071A2B" fill-opacity="0.85" stroke="#168BCE" stroke-width="1.5"/>
  <text x="60" y="450" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16">CONCEALED WIRING &amp; MODULAR LED FITTING</text>
  <text x="740" y="450" text-anchor="end" fill="#F5A623" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">COMMERCIAL OFFICE, MALAD</text>
</svg>