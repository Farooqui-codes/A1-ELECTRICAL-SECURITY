<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071828"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#secBg)"/>
  <!-- Multi-Screen Control Wall (2x2 Matrix) -->
  <g transform="translate(180, 80)">
    <!-- Screen 1 Top-Left -->
    <rect x="0" y="0" width="210" height="130" rx="6" fill="#051321" stroke="#168BCE" stroke-width="2"/>
    <text x="15" y="25" fill="#00E5FF" font-family="monospace" font-size="11">CAM_01: MAIN ENTRANCE</text>
    <circle cx="105" cy="70" r="30" fill="none" stroke="#168BCE" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Screen 2 Top-Right -->
    <rect x="230" y="0" width="210" height="130" rx="6" fill="#051321" stroke="#168BCE" stroke-width="2"/>
    <text x="245" y="25" fill="#00E5FF" font-family="monospace" font-size="11">CAM_02: PERIMETER GATE</text>
    <path d="M250,90 L335,45 L420,90" fill="none" stroke="#22C55E" stroke-width="1.5"/>

    <!-- Screen 3 Bottom-Left -->
    <rect x="0" y="150" width="210" height="130" rx="6" fill="#051321" stroke="#168BCE" stroke-width="2"/>
    <text x="15" y="175" fill="#00E5FF" font-family="monospace" font-size="11">CAM_03: PARKING LOT</text>
    <rect x="40" y="195" width="130" height="60" rx="4" fill="#0B253D"/>

    <!-- Screen 4 Bottom-Right (NVR Rack / Storage) -->
    <rect x="230" y="150" width="210" height="130" rx="6" fill="#051321" stroke="#168BCE" stroke-width="2"/>
    <text x="245" y="175" fill="#F5A623" font-family="monospace" font-size="11">SYS: 16CH 4K NVR RAID</text>
    <!-- Server Disk Drive Indicators -->
    <g transform="translate(250, 195)">
      <rect x="0" y="0" width="170" height="14" rx="2" fill="#1E293B"/>
      <circle cx="155" cy="7" r="3" fill="#22C55E"/>
      <rect x="0" y="22" width="170" height="14" rx="2" fill="#1E293B"/>
      <circle cx="155" cy="29" r="3" fill="#22C55E"/>
      <rect x="0" y="44" width="170" height="14" rx="2" fill="#1E293B"/>
      <circle cx="155" cy="51" r="3" fill="#22C55E"/>
    </g>
  </g>
  <!-- Status Badge -->
  <rect x="40" y="35" width="170" height="32" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <circle cx="58" cy="51" r="5" fill="#A78BFA"/>
  <text x="75" y="56" fill="#C4B5FD" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">NVR 16CH // SECURE</text>
  <!-- Footer Banner -->
  <rect x="40" y="420" width="720" height="48" rx="6" fill="#071A2B" fill-opacity="0.85" stroke="#168BCE" stroke-width="1.5"/>
  <text x="60" y="450" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16">16-CHANNEL NVR &amp; NETWORK SURVEILLANCE DESK</text>
  <text x="740" y="450" text-anchor="end" fill="#F5A623" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1">RESIDENTIAL SOCIETY</text>
</svg>